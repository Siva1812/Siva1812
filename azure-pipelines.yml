trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: '5461e8bf-f722-44f4-a98c-cd1cbc3194e1'
  acrName: 'myacrname'
  acrLoginServer: 'myacrname.azurecr.io'
  imageName: 'webapp'
  containerRegistry: 'myacrname'
  appServiceName: 'mywebappservice'

stages:
  - stage: Build
    displayName: 'Build Docker Image'
    jobs:
      - job: Build
        steps:
          - checkout: self
          
          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(acrLoginServer)/$(imageName)'
              dockerfile: '**/Dockerfile'
              containerRegistry: '$(azureSubscription)'
              tags: 'latest'

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    jobs:
      - job: Deploy
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy Container to Azure App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appServiceName)'
              containers: '$(acrLoginServer)/$(imageName):latest'
